name: Publish to Maven Central

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    name: Publish to Maven Central Portal
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Configure GPG Key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import

      - name: Publish to Maven Central
        shell: bash
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          mkdir -p ~/.m2
          cat << 'EOF' > ~/.m2/settings.xml
          <settings>
            <servers>
              <server>
                <id>central</id>
                <username>${env.SONATYPE_USERNAME}</username>
                <password>${env.SONATYPE_PASSWORD}</password>
              </server>
            </servers>
          </settings>
          EOF

          echo "=== 1. Building and Staging Artifacts ==="
          mvn clean deploy -P release -DskipPublishing=true --no-transfer-progress

          echo "=== 2. Staged Files in central-staging ==="
          find target/central-staging -type f

          echo "=== 3. Removing non-artifact files (_remote.repositories, metadata) ==="
          find target/central-staging -type f ! -name "kkhay-1.0.0*" -exec rm -v {} + || true

          echo "=== 4. Packaging Sanitized Bundle ==="
          cd target/central-staging
          rm -f ../central-publishing/central-bundle.zip
          mkdir -p ../central-publishing
          zip -r ../central-publishing/central-bundle.zip com/
          cd ../..

          echo "=== 5. Final Verified Bundle Content ==="
          unzip -l target/central-publishing/central-bundle.zip

          echo "=== 6. Uploading to Sonatype Central Portal ==="
          AUTH_HEADER="Bearer $(echo -n "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64 -w 0)"
          DEPLOYMENT_ID=$(curl -sS --fail-with-body --request POST \
            --header "Authorization: ${AUTH_HEADER}" \
            --form "bundle=@target/central-publishing/central-bundle.zip" \
            "https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC&name=com.kkhay:kkhay:1.0.0")

          echo "Deployment ID: ${DEPLOYMENT_ID}"

          echo "=== 7. Monitoring Publishing Status ==="
          for i in {1..60}; do
            STATUS_JSON=$(curl -sS --request POST \
              --header "Authorization: ${AUTH_HEADER}" \
              "https://central.sonatype.com/api/v1/publisher/status?id=${DEPLOYMENT_ID}")

            STATE=$(echo "${STATUS_JSON}" | jq -r '.deploymentState // "UNKNOWN"')
            echo "[Attempt ${i}/60] Current State: ${STATE}"

            if [ "${STATE}" = "PUBLISHED" ] || [ "${STATE}" = "VALIDATED" ]; then
              echo "Deployment successfully ${STATE}!"
              exit 0
            elif [ "${STATE}" = "FAILED" ]; then
              echo "Deployment validation failed! Error details:"
              echo "${STATUS_JSON}" | jq . || echo "${STATUS_JSON}"
              exit 1
            fi
            sleep 10
          done

          echo "Timed out waiting for validation."
          exit 1

